# Continuous monitoring outside releases (SEC-07).
#
# Only GitHub Actions are watched: the integration itself has no runtime
# dependencies, and keeping it that way is a design decision (SEC-01, D-12).
# Because actions are pinned to a SHA (SEC-03), Dependabot is what turns a new
# upstream release into a reviewable pull request instead of a silent change.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # CodeQL refuses to run when init and analyze differ in version, so a
    # pull request that bumps only one of them always fails. One group, one
    # pull request for both.
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
