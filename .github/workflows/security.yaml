# Dependency and code scanning (SEC-05, SEC-06, SEC-08).
#
# Actions are pinned to a commit SHA rather than a tag (SEC-03): a tag can be
# moved, a SHA cannot. Updating one is a deliberate act, and the comment says
# which ref it was at the time.

name: Security

on:
  push:
    branches: [main, new-architecture]
  pull_request:
    branches: [main, new-architecture]
  schedule:
    # Weekly, so a CVE published after a release still surfaces (SEC-07).
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependencies and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install scanners
        run: pip install --disable-pip-version-check pip-audit bandit

      # The integration ships zero runtime dependencies (SEC-01, D-12). The
      # gate is therefore nearly empty by design — its job is to make adding
      # one a visible decision rather than a silent one.
      - name: Collect the declared requirements
        run: |
          python3 - <<'PY'
          import json, pathlib
          manifest = json.loads(
              pathlib.Path("custom_components/renson_arean/manifest.json").read_text()
          )
          requirements = manifest["requirements"]
          pathlib.Path("requirements.txt").write_text("\n".join(requirements) + "\n")
          print("requirements:", requirements or "geen")
          PY

      - name: Audit dependencies
        run: pip-audit --strict --desc --format json --output pip-audit.json -r requirements.txt

      - name: Static analysis of our own code
        run: bandit -r custom_components -f json -o bandit.json

      # Archived per run, so it stays checkable afterwards what was known at
      # the time of release (SEC-08).
      - name: Archive scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: security-scan
          path: |
            pip-audit.json
            bandit.json
